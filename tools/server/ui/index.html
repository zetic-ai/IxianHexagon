<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ixian-server</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --fg: #e6e6e6; --muted: #8b93a7; --accent: #16867d; --user: #1f2937; --bot: #111827; --err: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #262a33; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; }
  header label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  header input[type=number] { width: 70px; background: #0b0d12; color: var(--fg); border: 1px solid #2a2f3a; border-radius: 6px; padding: 3px 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 860px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--user); }
  .assistant { align-self: flex-start; background: var(--bot); border: 1px solid #1f2937; }
  .reasoning { color: var(--muted); font-style: italic; border-left: 2px solid #374151; padding-left: 8px; margin-bottom: 6px; }
  .error { color: #fff; background: var(--err); }
  .stats { color: var(--muted); font-size: 12px; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid #262a33; }
  textarea { flex: 1; resize: none; height: 56px; background: #0b0d12; color: var(--fg); border: 1px solid #2a2f3a; border-radius: 8px; padding: 10px; font: inherit; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer; }
  button.secondary { background: #2a2f3a; }
  button:disabled { opacity: .5; cursor: default; }
  .media { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .media img, .media audio { max-height: 96px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>ixian-server</h1>
  <span class="meta" id="meta">connecting...</span>
  <label><input type="checkbox" id="think"> thinking</label>
  <label>max tokens <input type="number" id="maxtok" value="512" min="1"></label>
  <label><input type="file" id="file" accept="image/*,audio/*" multiple style="width:200px"></label>
  <button class="secondary" type="button" id="clear">New chat</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" placeholder="Message the model (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send" type="submit">Send</button>
  <button id="stop" type="button" class="secondary" disabled>Stop</button>
</form>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), form = $('form'), sendBtn = $('send'), stopBtn = $('stop');
  let history = [];
  let controller = null;
  let props = null;

  fetch('props').then(r => r.json()).then(p => {
    props = p;
    const mod = p.modalities || {};
    const caps = ['text', mod.vision ? 'image' : null, mod.audio ? 'audio' : null, mod.video ? 'video' : null].filter(Boolean).join(', ');
    $('meta').textContent = `${p.model_alias} on ${p.build_info} | input: ${caps} | context ${p.default_generation_settings.n_ctx}`;
    if (!mod.vision && !mod.audio) $('file').style.display = 'none';
  }).catch(() => { $('meta').textContent = 'cannot read /props'; });

  function add(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function buildUserContent(text) {
    const files = Array.from($('file').files);
    if (files.length === 0) return text;
    const parts = [];
    for (const f of files) {
      const url = await fileToDataUrl(f);
      if (f.type.startsWith('image/')) parts.push({ type: 'image_url', image_url: { url } });
      else if (f.type.startsWith('audio/')) parts.push({ type: 'input_audio', input_audio: { data: url.split(',')[1], format: f.name.split('.').pop() } });
    }
    parts.push({ type: 'text', text });
    return parts;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || controller) return;
    input.value = '';
    const content = await buildUserContent(text);
    $('file').value = '';
    history.push({ role: 'user', content });
    add('user', text + (Array.isArray(content) ? `\n[${content.length - 1} media]` : ''));

    const el = add('assistant', '');
    const reasoningEl = document.createElement('div');
    reasoningEl.className = 'reasoning';
    reasoningEl.style.display = 'none';
    const textEl = document.createElement('div');
    const statsEl = document.createElement('div');
    statsEl.className = 'stats';
    el.textContent = '';
    el.append(reasoningEl, textEl, statsEl);

    controller = new AbortController();
    sendBtn.disabled = true;
    stopBtn.disabled = false;
    let reply = '', reasoning = '';
    const t0 = performance.now();
    let firstToken = 0;
    try {
      const res = await fetch('v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          messages: history,
          stream: true,
          max_tokens: parseInt($('maxtok').value, 10) || 512,
          chat_template_kwargs: { enable_thinking: $('think').checked },
          stream_options: { include_usage: true },
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: { message: res.statusText } }));
        throw new Error(err.error ? err.error.message : res.statusText);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let timings = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const event = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          for (const line of event.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            const chunk = JSON.parse(data);
            if (chunk.error) throw new Error(chunk.error.message);
            if (chunk.timings) timings = chunk.timings;
            const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
            if (!delta) continue;
            if (delta.reasoning_content) { reasoning += delta.reasoning_content; reasoningEl.style.display = ''; reasoningEl.textContent = reasoning; }
            if (delta.content) { if (!firstToken) firstToken = performance.now(); reply += delta.content; textEl.textContent = reply; }
            log.scrollTop = log.scrollHeight;
          }
        }
      }
      history.push({ role: 'assistant', content: reply });
      const total = (performance.now() - t0) / 1000;
      statsEl.textContent = timings
        ? `${timings.predicted_n} tokens, ${timings.predicted_per_second.toFixed(1)} t/s, prompt ${timings.prompt_n} rows (${timings.cache_n} cached) in ${timings.prompt_ms.toFixed(0)} ms, total ${total.toFixed(1)} s`
        : `${total.toFixed(1)} s`;
    } catch (e) {
      if (e.name === 'AbortError') {
        history.push({ role: 'assistant', content: reply });
        statsEl.textContent = 'stopped';
      } else {
        el.classList.add('error');
        textEl.textContent = 'error: ' + e.message;
        history.pop();
      }
    } finally {
      controller = null;
      sendBtn.disabled = false;
      stopBtn.disabled = true;
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  stopBtn.addEventListener('click', () => { if (controller) controller.abort(); });
  $('clear').addEventListener('click', () => { history = []; log.innerHTML = ''; });
})();
</script>
</body>
</html>
